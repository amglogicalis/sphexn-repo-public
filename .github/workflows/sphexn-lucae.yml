name: Sphexn Lucae — Architectural Synthesizer

on:
  workflow_dispatch:
    inputs:
      repo:
        description: 'Target repository to analyze (owner/repo)'
        required: false
        default: 'amglogicalis/Sphexn'
      branch:
        description: 'Branch to analyze'
        required: false
        default: 'main'
      threshold:
        description: 'Max lines threshold for God Files'
        required: false
        default: '500'
  push:
    branches: [ main ]
  pull_request:
    branches: [ main ]

permissions:
  contents: write
  issues: write
  pull-requests: write

jobs:
  lucae-analysis:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Target Code
        uses: actions/checkout@v4
        with:
          repository: ${{ inputs.repo || github.repository }}
          ref: ${{ inputs.branch || github.ref }}
          fetch-depth: 0

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20

      - name: Run Sphexn Lucae AST Analysis
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          npx --yes terra-sphexn lucae --threshold ${{ inputs.threshold || 500 }}
