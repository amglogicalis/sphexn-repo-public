name: Sphexn Lucae — Architectural Synthesizer

on:
  workflow_dispatch:
    inputs:
      repo:
        description: 'Target repository to analyze (owner/repo)'
        required: true
        default: 'amglogicalis/pokemon-tcg-project'
      branch:
        description: 'Branch to analyze'
        required: false
        default: 'main'
      threshold:
        description: 'Max lines threshold for God Files'
        required: false
        default: '500'

permissions:
  contents: write
  actions: read

jobs:
  lucae-analysis:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Vault
        uses: actions/checkout@v4

      - name: Checkout Target Code
        uses: actions/checkout@v4
        with:
          repository: ${{ inputs.repo }}
          ref: ${{ inputs.branch }}
          token: ${{ secrets.GITHUB_TOKEN }}
          path: target-code
          fetch-depth: 0

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20

      - name: Run Enterprise Sphexn Lucae Analyzer
        run: |
          node .sphexn/lucae-runner.js "${{ inputs.repo }}" "${{ inputs.branch }}" "${{ inputs.threshold }}"

      - name: Commit and Push Audit Results to Vault
        run: |
          git config --global user.name "Sphexn Lucae [Bot]"
          git config --global user.email "bot@sphexn.terra"
          git add audits/
          if git diff --staged --quiet; then
            echo "No audit changes to commit"
          else
            git commit -m "chore(lucae): record enterprise architectural audit for ${{ inputs.repo }}"
            git push origin main || echo "Audit pushed or up-to-date"
          fi
